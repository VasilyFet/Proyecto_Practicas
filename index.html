<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto Violeta - Las Palmas de Gran Canaria</title>
    <!-- Enlace a tu archivo CSS externo -->
    <link rel="stylesheet" href="style.css">

    <!-- Estilos específicos para la integración del logo ICSE -->
    <style>
        .header-top {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 24px 8px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo-icse {
            max-height: 42px; /* Tamaño discreto, elegante y no agresivo */
            width: auto;
            object-fit: contain;
            opacity: 0.9;
            transition: opacity 0.2s ease;
        }

        .logo-icse:hover {
            opacity: 1;
        }

        /* Ajuste para pantallas pequeñas (móviles) */
        @media (max-width: 600px) {
            .header-top {
                padding: 12px 16px 4px 16px;
            }
            .logo-icse {
                max-height: 34px;
            }
        }
    </style>
</head>
<body>

    <!-- CABECERA CON LOGO ICSE EN LA ESQUINA SUPERIOR IZQUIERDA -->
    <header class="header-top">
        <a href="#" aria-label="Inicio ICSE">
            <!-- Sustituye "logo-icse.png" por la ruta o nombre real de la imagen de tu logo -->
            <img src="logo-icse.png" alt="Logo ICSE" class="logo-icse">
        </a>
    </header>

    <main class="contenedor-principal">
        
        <!-- ZONA SUPERIOR: Información crítica y teléfonos de emergencia -->
        <section class="tarjeton header-emergencia">
            <span class="etiqueta-punto">Punto Violeta Digital - Las Palmas</span>
            <h1>Recursos y Asistencia Inmediata</h1>
            <p>Atención integral y recursos disponibles 24/7 en Las Palmas de Gran Canaria.</p>
            
            <div class="telefonos-grid">
                <a href="tel:016" class="btn-telefono urgente">
                    <strong>016</strong> <span>Atención contra la Violencia de Género</span>
                </a>
                <a href="tel:112" class="btn-telefono emergencia">
                    <strong>112</strong> <span>Emergencias Generales (Islas Canarias)</span>
                </a>
            </div>
        </section>

        
        <!-- ZONA INFERIOR: Cuadrícula (Grid) de viñetas estilo galería -->
        <section class="galeria-viñetas">
            <h2>Guías e Información Visual</h2>
            
            <div class="grid-viñetas">
                <!-- Viñeta 1 -->
                <div class="tarjeton-viñeta">
                    <img src="1.jpeg" alt="Viñeta informativa 1" class="img-viñeta">
                </div>
                <!-- Viñeta 2 -->
                <div class="tarjeton-viñeta">
                    <img src="2.jpeg" alt="Viñeta informativa 2" class="img-viñeta">
                </div>
                <!-- Viñeta 3 -->
                <div class="tarjeton-viñeta">
                    <img src="3.jpeg" alt="Viñeta informativa 3" class="img-viñeta">
                </div>
                <!-- Viñeta 4 -->
                <div class="tarjeton-viñeta">
                    <img src="4.jpeg" alt="Viñeta informativa 4" class="img-viñeta">
                </div>
            </div>
        </section>

    </main>

    <!-- Ventana modal global para ampliar cualquier viñeta al hacer clic -->
    <div id="modalImagen" class="modal">
        <span class="cerrar">&times;</span>
        <img class="modal-contenido" id="imgAmpliada" alt="Viñeta ampliada">
    </div>

    <!-- Enlace al archivo JavaScript externo (al final del body para carga segura) -->
    <script src="script.js"></script>
</body>
</html>
